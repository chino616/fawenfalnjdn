[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "CEvNS-pyEFT"
version = "0.1.0a1"
description = "Python EFT toolkit for coherent elastic neutrino-nucleus scattering."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "CEvNS-pyEFT contributors" }
]
dependencies = [
  "numpy>=2.0",
  "jsonschema>=4.18",
  "pandas",
  "matplotlib",
  "scipy",
  "streamlit",
  "pillow"
]

[project.scripts]
cevns-pyeft = "cevns_pyeft.cli:main"

[project.optional-dependencies]
validation = ["jsonschema>=4.18"]

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["cevns_pyeft*"]

[tool.setuptools.cmdclass]
build_py = "tools.package_build.BuildWithDatasetPackages"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.package-data]
"cevns_pyeft.experiments" = ["dataset_registry.json", "input_package.schema.json", "model_bindings.json", "generic_input.schema.json", "component_bindings.json"]
"cevns_pyeft.experiments.coherent" = ["csi2021_package_contract.json"]
