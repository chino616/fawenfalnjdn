[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "CEvNS-pyEFT"
version = "0.1.0a1"
description = "Python EFT toolkit for coherent elastic neutrino-nucleus scattering."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "CEvNS-pyEFT contributors" }
]
dependencies = [
  "numpy",
  "pandas",
  "matplotlib",
  "scipy",
  "streamlit",
  "pillow"
]

[project.scripts]
cevns-pyeft = "cevns_pyeft.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["cevns_pyeft*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
