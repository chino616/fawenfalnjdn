{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "type": "object",
  "title": "physics-contract",
  "required": [
    "contract_version",
    "dataset_id",
    "sections"
  ],
  "properties": {
    "contract_version": {
      "type": "integer",
      "minimum": 1
    },
    "dataset_id": {
      "type": [
        "string",
        "null"
      ]
    },
    "scientific_claim": {
      "type": [
        "string",
        "null"
      ]
    },
    "sections": {
      "type": "object",
      "additionalProperties": {
        "type": "object",
        "properties": {
          "decision_status": {
            "enum": [
              "DRAFT",
              "APPROVED",
              "BLOCKED",
              "NOT_APPLICABLE"
            ]
          },
          "fields": {
            "type": "object"
          }
        }
      }
    }
  },
  "allOf": [
    {
      "if": {
        "properties": {
          "contract_version": {
            "minimum": 4
          }
        }
      },
      "then": {
        "properties": {
          "sections": {
            "additionalProperties": {
              "required": [
                "decision_status",
                "fields"
              ],
              "properties": {
                "decision_refs": {
                  "type": "array",
                  "items": {
                    "type": "string",
                    "minLength": 1
                  },
                  "uniqueItems": true
                },
                "evidence_refs": {
                  "type": "array",
                  "items": {
                    "type": "string",
                    "minLength": 1
                  },
                  "uniqueItems": true
                }
              },
              "allOf": [
                {
                  "if": {
                    "properties": {
                      "decision_status": {
                        "const": "APPROVED"
                      }
                    }
                  },
                  "then": {
                    "required": [
                      "decision_refs",
                      "evidence_refs"
                    ],
                    "properties": {
                      "fields": {
                        "minProperties": 1
                      },
                      "decision_refs": {
                        "minItems": 1
                      },
                      "evidence_refs": {
                        "minItems": 1
                      }
                    }
                  }
                }
              ]
            }
          }
        }
      }
    }
  ]
}
