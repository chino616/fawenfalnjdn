dataset_id: conus_plus_ge73_pheno
family: conus
physics_document: docs/CONUS_docs/2026_07_16_CEvNSpyEFT - CONUS.pdf
reference_documents: []
attached_data: []
optional_reference_code: []
dataset_identity:
  run_period: phenomenological_effective_dataset
  detector_configuration: effective_Ge73_detector
  source_configuration: reactor_electron_antineutrino_flux_at_detector
  target_configuration: Ge73_only
  statistical_data_mode: background_subtracted_excess
  observable_axes:
  - reco_energy_evee
  expected_output_shape:
  - 19
workflow_phase_order:
- cevns-experiment-intake
- cevns-dataset
- cevns-target
- cevns-source
- cevns-theory-response
- cevns-kinematics-cross-section
- cevns-detector-response
- cevns-slow-counts
- cevns-fast-counts
- cevns-statistics
- cevns-validation-registry
modules:
  dataset:
    status: CONFIG_ONLY
    user_document_section: 1.2 Data set; 1.3 Detector; 1.3.2 Threshold and analysis window
    csi_reference_files:
    - src/cevns_pyeft/experiments/base.py
    - src/cevns_pyeft/experiments/registry.py
    - src/cevns_pyeft/experiments/specs.py
    - schemas/experiment.schema.json
    reuse_files:
    - src/cevns_pyeft/experiments/specs.py
    - schemas/experiment.schema.json
    create_files:
    - data/experiments/conus_plus_ge73_pheno/experiment.yaml
    - data/experiments/conus_plus_ge73_pheno/README.md
    modify_files: []
    must_not_modify:
    - src/cevns_pyeft/experiments/coherent/slow_counts_csi2017.py
    - src/cevns_pyeft/experiments/coherent/slow_counts_csi2021.py
    - src/cevns_pyeft/experiments/coherent/slow_counts_ar2020.py
    public_api:
    - name: get_experiment_spec
      source: src/cevns_pyeft/experiments/registry.py
      inputs:
      - dataset_id
      returns:
        type: ExperimentSpec
        shape: scalar_object
        axes: []
    tests:
    - path: tests/test_conus_plus_ge73_pheno_dataset.py
      purpose: validate dataset discovery, source_type, target_mode, rule-based 160-350 eVee binning,
        and 19-bin expected shape
      expected_output: conus_plus_ge73_pheno is discoverable through list_experiments(include_specs=True),
        with rule_binning.number_of_bins = 19
      tolerance: exact_metadata_match
      reference_provenance: physics_document_sections_1.2_and_1.3.2
    blockers: []
  source:
    status: ADAPTER
    user_document_section: 1.4.1 Reactor electron antineutrino flux
    csi_reference_files:
    - src/cevns_pyeft/experiments/coherent/sns.py
    - src/cevns_pyeft/experiments/coherent/slow_counts_csi2017.py
    - src/cevns_pyeft/experiments/coherent/slow_counts_csi2021.py
    reuse_files:
    - src/cevns_pyeft/experiments/base.py
    create_files:
    - data/experiments/conus_plus_ge73_pheno/mueller_coefficients.csv
    - data/experiments/conus_plus_ge73_pheno/kopeikin_low_energy_spectrum.csv
    - src/cevns_pyeft/experiments/conus/source.py
    modify_files: []
    must_not_modify:
    - src/cevns_pyeft/experiments/coherent/sns.py
    - data/experiments/external/dayabay/README.md
    - data/experiments/external/user_mathematica/README.md
    public_api:
    - name: load_conus_plus_ge73_reactor_flux
      inputs:
      - experiment_spec
      keyword_arguments: []
      input_units:
        energy: MeV
        flux: cm^-2 s^-1 MeV^-1
      returns:
        type: dict
        shape: scalar_object_with_callable_flux
        axes:
        - electron_antineutrino_energy_MeV
        component_labels:
        - nuebar
      error_behavior: reject nonpositive normalization integral; return zero outside [0.01, 10] MeV except
        matched interpolation and Mueller domains
    tests:
    - path: tests/test_conus_plus_ge73_pheno_source.py
      purpose: validate release reactor flux definition
      expected_output: Mueller coefficients and Kopeikin nodes match the document; flux is zero for E_nu
        < 0, 0 <= E_nu < 0.01 MeV, and E_nu > 10 MeV; flux is nonnegative on 0.01 <= E_nu <= 10 MeV; spectrum
        is continuous at 2 MeV; total flux integrates to 1.5e13 cm^-2 s^-1; scalar and array inputs agree
      tolerance: exact_table_match_and_relative_5e-6_for_integral
      reference_provenance: physics_document_tables_1_and_2_with_release_zero_low_endpoint_boundary
    blockers: []
  target:
    status: CONFIG_ONLY
    phase_behavior: text_only_inventory_before_source
    user_document_section: 1.3.1 Detector mass and exposure; 1.3.3 Target and Response mapping
    csi_reference_files:
    - src/cevns_pyeft/experiments/coherent/slow_counts_csi2017.py
    - src/cevns_pyeft/experiments/coherent/slow_counts_csi2021.py
    - src/cevns_pyeft/nuclear/response.py
    reuse_files:
    - src/cevns_pyeft/nuclear/response.py
    - data/responses/responses_all.json
    create_files:
    - workflows/experiment-integration/runs/conus_plus_ge73_pheno/02_DETECTOR_TARGET.md
    modify_files: []
    must_not_modify:
    - data/responses/responses_all.json
    - src/cevns_pyeft/nuclear/response.py
    public_api:
    - name: ResponseDB.get
      inputs:
      - Ge73
      returns:
        type: ResponseW
        shape: scalar_object
        axes:
        - response_channel
    tests: []
    report_checks:
    - validate Ge73 response availability from existing Response data
    - record experiment.yaml target fields A/Z/N/response_key/molar_mass_g_mol
    - record nuclei-per-kilogram convention as text
    blockers: []
  theory_response:
    status: REUSE
    user_document_section: 1.5 Amplitude calculation
    csi_reference_files:
    - src/cevns_pyeft/theory/li2026/
    - src/cevns_pyeft/nuclear/response.py
    reuse_files:
    - src/cevns_pyeft/theory/li2026/amplitude.py
    - src/cevns_pyeft/theory/li2026/left_to_ci.py
    - src/cevns_pyeft/theory/li2026/responses.py
    - src/cevns_pyeft/nuclear/response.py
    create_files: []
    modify_files: []
    must_not_modify:
    - src/cevns_pyeft/theory/li2026/amplitude.py
    - src/cevns_pyeft/theory/li2026/left_to_ci.py
    - src/cevns_pyeft/theory/li2026/responses.py
    - src/cevns_pyeft/nuclear/response.py
    public_api:
    - name: amplitude_squared_onebody_li2026
      inputs:
      - ResponseW
      - E_nu_GeV
      - ER_keV
      - left_hat
      returns:
        type: amplitude_result
        shape: scalar_object
        axes:
        - response_channel
    tests:
    - path: tests/test_conus_plus_ge73_pheno_theory.py
      purpose: smoke-test Ge73 Response through existing Li2026 amplitude path at a valid recoil and neutrino
        energy
      expected_output: finite nonnegative amplitude squared
      tolerance: finite_nonnegative
      reference_provenance: existing_theory_contract
    blockers: []
  kinematics_cross_section:
    status: ADAPTER
    user_document_section: 1.6 Kinematics; 1.7 Cross section calculation
    csi_reference_files:
    - src/cevns_pyeft/rates/differential.py
    reuse_files:
    - src/cevns_pyeft/rates/differential.py
    create_files:
    - src/cevns_pyeft/experiments/conus/kinematics.py
    modify_files: []
    must_not_modify:
    - src/cevns_pyeft/rates/differential.py
    public_api:
    - name: enu_min_heavy_nucleus_conus_ge73
      inputs:
      - T_keVnr
      - mA_GeV
      input_units:
        T_keVnr: keVnr
        mA_GeV: GeV
      returns:
        type: numpy.ndarray_or_float
        shape: input_shape
        unit: MeV
      error_behavior: return finite nonnegative threshold for finite nonnegative recoil energies
    - name: differential_cross_section_nn
      source: src/cevns_pyeft/rates/differential.py
      inputs:
      - ResponseW
      - ER_keV
      - Enu_MeV
      - wc_triplets
      input_units:
        ER_keV: keVnr
        Enu_MeV: MeV
      returns:
        type: DSigmaResult
        shape: scalar_or_array_matching_Enu_MeV
        unit: cm2_per_keV
        axes:
        - neutrino_energy
    tests:
    - path: tests/test_conus_plus_ge73_pheno_kinematics.py
      purpose: validate experiment-level heavy-nucleus E_nu,min helper and ensure exact kinematics remains
        diagnostic only
      expected_output: heavy-nucleus helper matches document formula; public differential_cross_section_nn
        is unmodified and remains reusable
      tolerance: relative_1e-12_for_formula_smoke_checks
      reference_provenance: physics_document_sections_1.6_and_1.7
    blockers: []
  detector_response:
    status: ADAPTER
    user_document_section: 1.8.1 Quenching, energy resolution, and trigger efficiency
    csi_reference_files:
    - src/cevns_pyeft/experiments/coherent/slow_counts_csi2017.py
    - src/cevns_pyeft/experiments/coherent/slow_counts_csi2021.py
    - src/cevns_pyeft/rates/counts.py
    reuse_files:
    - src/cevns_pyeft/rates/differential.py
    create_files:
    - src/cevns_pyeft/experiments/conus/detector_response.py
    modify_files: []
    must_not_modify:
    - src/cevns_pyeft/rates/counts.py
    - src/cevns_pyeft/experiments/coherent/slow_counts_csi2017.py
    - src/cevns_pyeft/experiments/coherent/slow_counts_csi2021.py
    public_api:
    - name: lindhard_quenching_ge
      inputs:
      - T_keVnr
      returns:
        type: numpy.ndarray_or_float
        shape: input_shape
        unit: dimensionless
    - name: conus_ge73_response_density
      inputs:
      - E_reco_eVee
      - T_keVnr
      returns:
        type: numpy.ndarray_or_float
        shape: broadcast_shape
        unit: eVee^-1
    tests:
    - path: tests/test_conus_plus_ge73_pheno_detector_response.py
      purpose: validate Lindhard Q(T), sigma(Eee), step efficiency, and response normalization diagnostics
      expected_output: efficiency is zero below 160 eVee and one at/above threshold
      tolerance: absolute_1e-12_for_step_efficiency
      reference_provenance: physics_document_section_1.8.1
    blockers: []
  slow_counts:
    status: ADAPTER
    user_document_section: 1.8.2 Slow event counts
    csi_reference_files:
    - src/cevns_pyeft/experiments/coherent/slow_counts_csi2017.py
    - src/cevns_pyeft/experiments/coherent/slow_counts_csi2021.py
    - src/cevns_pyeft/experiments/coherent/slow_counts_ar2020.py
    reuse_files:
    - src/cevns_pyeft/nuclear/response.py
    - src/cevns_pyeft/rates/differential.py
    create_files:
    - src/cevns_pyeft/experiments/conus/slow_counts_conus_plus_ge73_pheno.py
    - tests/reference_conus_plus_ge73_pheno/slow_counts_sm.json
    modify_files: []
    must_not_modify:
    - src/cevns_pyeft/experiments/coherent/slow_counts_csi2017.py
    - src/cevns_pyeft/experiments/coherent/slow_counts_csi2021.py
    - src/cevns_pyeft/experiments/coherent/slow_counts_ar2020.py
    - tests/reference_fast_split/csi2017_full_kernel.npy
    - tests/reference_fast_split/csi2021_full_kernel.npy
    - tests/reference_fast_split/ar2020_full_kernel.npy
    public_api:
    - name: slow_counts_conus_plus_ge73_pheno
      inputs:
      - coefficients
      - experiment_spec
      keyword_arguments:
      - return_components
      - integration_settings
      returns:
        type: dict
        arrays:
          counts_per_bin:
            dtype: float64
            shape:
            - 19
            unit: expected_events_per_bin
          reco_energy_axis_evee:
            dtype: float64
            shape:
            - 20
            unit: eVee
        optional_component_diagnostics:
          shape: implementation_defined
          labels:
          - nuebar
          - Ge73
      error_behavior: resolve ResponseDB from experiment_spec or project defaults; avoid hard-coded absolute
        paths and repeated ordinary-call loading
    tests:
    - path: tests/test_conus_plus_ge73_pheno_slow_counts.py
      purpose: validate output shape, finite nonnegative SM bins, zero outside kinematic support, and
        reproducibility against saved Slow reference
      expected_output: counts_per_bin has shape [19]
      tolerance: relative_1e-6_against_reference_after_reference_is_generated
      reference_provenance: slow_reference_generated_from_phase_7_direct_integration
    blockers: []
  fast_counts:
    status: ADAPTER
    user_document_section: 1.8.3 Fast event counts
    csi_reference_files:
    - src/cevns_pyeft/experiments/coherent/fast_kernel_csi2021.py
    - src/cevns_pyeft/kernels/basis.py
    - src/cevns_pyeft/kernels/builder.py
    - src/cevns_pyeft/kernels/reconstruction.py
    - src/cevns_pyeft/kernels/storage.py
    reuse_files:
    - src/cevns_pyeft/kernels/basis.py
    - src/cevns_pyeft/kernels/reconstruction.py
    - src/cevns_pyeft/kernels/storage.py
    create_files: []
    modify_files: []
    must_not_modify:
    - src/cevns_pyeft/experiments/coherent/fast_kernel_csi2017.py
    - src/cevns_pyeft/experiments/coherent/fast_kernel_csi2021.py
    - src/cevns_pyeft/experiments/coherent/fast_kernel_ar2020.py
    - tests/reference_fast_split/
    public_api: []
    tests: []
    blockers: []
    submodules:
      cumulative_fast:
        status: ADAPTER
        create_files:
        - src/cevns_pyeft/experiments/conus/fast_cumulative_conus_plus_ge73_pheno.py
        blockers: []
        public_api:
        - name: cumulative_fast_counts_conus_plus_ge73_pheno
          inputs:
          - slow_spectrum_callable
          - experiment_spec
          returns:
            type: numpy.ndarray
            dtype: float64
            shape:
            - 19
            unit: expected_events_per_bin
        tests:
        - path: tests/test_conus_plus_ge73_pheno_cumulative_fast.py
          purpose: compare cumulative Fast against validated Slow for the same integration setup
          expected_output: 19-bin cumulative Fast agrees with Slow within later fixed tolerance
          tolerance: TBD_after_slow_reference
          reference_provenance: physics_document_section_1.8.3_and_phase_7_slow_reference
      eft_template_fast:
        status: BLOCKED
        planned_file_after_unblocked: src/cevns_pyeft/experiments/conus/fast_kernel_conus_plus_ge73_pheno.py
        create_files: []
        blockers:
        - Complete 20-group EFT template basis mapping is not yet defined.
        - The 20 x 19 template array must be generated from validated Slow counts.
        - Do not generate formal kernels or template reference files before the basis order is fixed.
        public_api: []
        tests: []
  statistics:
    status: ADAPTER
    user_document_section: 1.9 Statistical analysis
    csi_reference_files: []
    reuse_files: []
    create_files:
    - data/experiments/conus_plus_ge73_pheno/excess_counts.csv
    - src/cevns_pyeft/experiments/conus/statistics_conus_plus_ge73_pheno.py
    modify_files: []
    must_not_modify:
    - src/cevns_pyeft/experiments/coherent/
    public_api:
    - name: chi2_profile_conus_plus_ge73_pheno
      inputs:
      - theory_counts
      input_units:
        theory_counts: expected_events_per_bin
      returns:
        type: dict
        shape: scalar_object
        fields:
          chi2_prof: scalar
          alpha_hat: scalar
          residuals:
            shape:
            - 19
    tests:
    - path: tests/test_conus_plus_ge73_pheno_statistics.py
      purpose: validate 19-bin data table, sigma construction, analytic alpha profile, and direct-minimization
        agreement
      expected_output: alpha_hat analytic equals numerical minimizer
      tolerance: absolute_1e-10_for_alpha_hat
      reference_provenance: physics_document_sections_1.9.1_and_1.9.2
    blockers:
    - Benchmark Wilson parameter points and expected chi2_prof / Delta chi2 values are referenced but
      not numerically specified in the PDF.
  validation_registry:
    status: ADAPTER
    user_document_section: 1.10 Computation targets
    csi_reference_files:
    - tests/test_experiment_specs.py
    - tests/reference_fast_split/
    - src/cevns_pyeft/experiments/registry.py
    reuse_files:
    - src/cevns_pyeft/experiments/specs.py
    create_files:
    - tests/test_conus_plus_ge73_pheno_dataset.py
    - tests/test_conus_plus_ge73_pheno_source.py
    - tests/test_conus_plus_ge73_pheno_detector_response.py
    - tests/test_conus_plus_ge73_pheno_slow_counts.py
    - tests/test_conus_plus_ge73_pheno_fast_counts.py
    - tests/test_conus_plus_ge73_pheno_statistics.py
    modify_files:
    - tests/test_experiment_specs.py
    must_not_modify:
    - src/cevns_pyeft/experiments/coherent/slow_counts_csi2017.py
    - src/cevns_pyeft/experiments/coherent/slow_counts_csi2021.py
    - src/cevns_pyeft/experiments/coherent/slow_counts_ar2020.py
    - src/cevns_pyeft/experiments/coherent/fast_kernel_csi2017.py
    - src/cevns_pyeft/experiments/coherent/fast_kernel_csi2021.py
    - src/cevns_pyeft/experiments/coherent/fast_kernel_ar2020.py
    - src/cevns_pyeft/theory/
    - src/cevns_pyeft/nuclear/
    - src/cevns_pyeft/rates/
    - src/cevns_pyeft/kernels/
    - tests/reference_fast_split/
    public_api:
    - name: list_experiments
      inputs: []
      returns:
        type: tuple
        shape:
        - n_experiments
        unit: dataset_names
    - name: get_slow_count_function
      inputs:
      - conus_plus_ge73_pheno
      returns:
        type: callable
        shape: scalar_callable
    tests:
    - path: tests/test_conus_plus_ge73_pheno_registry.py
      purpose: validate experiment discovery and slow-count registry after implementation
      expected_output: dataset spec discoverable and slow-count callable registered
      tolerance: exact
      reference_provenance: current_registry_contract
    blockers:
    - tests/test_experiment_specs.py currently contains stale assertions for previously deleted CONUS
      datasets and must be updated during validation/registry work.
    - Do not modify src/cevns_pyeft/experiments/registry.py unless Phase 10 proves the existing experiment.yaml
      discovery mechanism is insufficient for callable loading.
    conditional_modify_files:
    - path: src/cevns_pyeft/experiments/registry.py
      condition: Only in Phase 10 if the existing experiment.yaml discovery mechanism cannot load the
        new callable type.
global_blockers:
- No separate machine-readable attachments were supplied; all tables currently come from the PDF extraction.
- Complete EFT template basis for all 20 groups and benchmark chi-square points are not fully specified
  in the PDF.
gate:
  phase: I
  status: PASS
  reasons:
  - 'One independent dataset ID was identified: conus_plus_ge73_pheno.'
  - The user-specified PDF was fully inventoried and visually checked on key table pages.
  - Supplied scalar parameters, formulas, numerical tables, units, and output shape were recorded.
  - The statistical data mode was identified as background_subtracted_excess.
  - Every module has exactly one primary classification.
  - Reusable repository files were inspected rather than inferred from filenames.
  - Planned files and public APIs are concrete.
  - Known blockers are explicit and assigned to later phases.
  - No production code or production data were created during Phase 0.
next_skill: cevns-dataset
