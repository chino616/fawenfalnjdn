  statistics:
    status: BLOCKED
    user_document_sections:
      - none in Flavor migration documents
    supplied_inputs: []
    numerical_tables: []
    physical_contract:
      data_mode: background_subtracted_excess
      observed_data: not authoritatively supplied
      background_data: not authoritatively supplied
      covariance: not supplied
      nuisance_parameters: []
      test_statistic: not supplied
      profiling: not supplied
      confidence_construction: not supplied
    csi_reference_files: []
    reuse_files: []
    create_files: []
    modify_files: []
    conditional_modify_files: []
    must_not_modify:
      - data/datafiles/COHERENT_data.txt
      - data/datafiles/COHERENT_lower.txt
      - data/datafiles/COHERENT_upper.txt
    public_api: []
    tests: []
    reference_outputs: []
    blockers:
