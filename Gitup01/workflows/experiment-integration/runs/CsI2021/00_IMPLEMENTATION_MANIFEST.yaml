  validation_registry:
    status: ADAPTER
    user_document_sections:
      - P3 Gate reporting
    supplied_inputs:
      - existing registry
      - P2 and CsI references
    discovery_strategy: preserve current Python registry; add focused P3 tests only
    csi_reference_files:
      - src/cevns_pyeft/experiments/registry.py
    reuse_files:
      - src/cevns_pyeft/experiments/registry.py
    create_files:
      - tests/test_csi_slow_source_state_p3.py
    modify_files: []
    conditional_modify_files: []
    must_not_modify:
      - tests/reference_fast_split/
    public_api: []
    tests:
      - path: tests/test_csi_slow_source_state_p3.py
        purpose: aggregate P3 Source/Slow Gate
        inputs: both Cs/I targets and all three SNS components
        expected: state mapping, direct contraction, sums, shapes, units and regression pass
        tolerance: contract-specific explicit tolerances
        provenance: P3 user documents and existing references
    regression_scope:
      - P0-P2 Flavor tests
      - Helm and CsI differential tests
      - CsI2021 and CsI2021 Slow tests
      - Ar2020 non-regression because shared SNS/counts code is touched
      - exclude CONUS-specific implementation work
    blockers: []

global_blockers:
  - ANTI-NU AUDIT is required before changing nu/antinu kernel physics
  - P4 Fast redesign is not part of P3
  - statistics provenance is absent

protected_existing_datasets:
  - CsI2017 public behavior
  - CsI2021 behavior outside approved source-state and Slow plumbing
  - Ar2020 behavior and source outputs
  - all CONUS and CONUS+ implementations

gate:
  phase: I
  status: PASS
  reasons:
    - CsI2021 is uniquely identified and all P3 inputs and observable axes are inventoried
    - every module has one classification and concrete file boundaries
    - source and Slow APIs, units, shapes, tests and blockers are explicit
    - no production code or production data was created or modified in Phase 0

